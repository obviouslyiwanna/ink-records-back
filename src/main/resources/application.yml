spring:
  application:
    name: ink-records
  datasource:
    url: jdbc:h2:file:./data/ink-records;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

ink-records:
  upload-dir: ./data/uploads
